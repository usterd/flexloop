<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexloop</title>

<!-- viewport-fit=cover lets us paint into the notch / home-indicator area,
     which we then pad back with env(safe-area-inset-*) in CSS. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090B" id="theme-color">

<meta name="description" content="Offline gym journal.">

<!-- iOS standalone mode. The first is legacy-but-still-required on iOS;
     the second is the standardised replacement. Ship both. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black" id="ios-status-bar">
<meta name="apple-mobile-web-app-title" content="flexloop">
<meta name="format-detection" content="telephone=no">

<!-- Theme before first paint. app.js is a module and therefore deferred, so
     leaving this to it would flash the dark shell at a light-theme user on
     every launch. Deliberately duplicated from db.js DEFAULT_SETTINGS: it has
     to run without importing anything. -->
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('flexloop.settings') || '{}');
    var t = s.theme || 'dark';
    if (t === 'auto') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    if (t === 'light') {
      document.querySelector('#theme-color').setAttribute('content', '#F6F7F9');
      // Neither theme asks iOS for a full-screen web view. black-translucent
      // is the only value that grants one, and all it buys is the strip behind
      // the home indicator — which --tab-pad-b then has to pad straight back
      // out. It costs bar height and returns nothing. That leaves only which
      // opaque bar to reserve: black over a dark page, default over a light
      // one, since black draws the clock and battery in white. iOS reads this
      // meta while parsing the head, so it has to be rewritten here rather
      // than later from app.js — and a theme switched mid-session only takes
      // effect at the next launch.
      document.querySelector('#ios-status-bar').setAttribute('content', 'default');
    }
  } catch (e) { /* private mode: dark it is */ }
})();
</script>

<!-- iOS ignores manifest icons for the Home Screen and uses this instead. -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- Rest timer + update banner live above the nav, out of the scroll flow. -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <a class="wordmark-link" href="https://usterd.github.io/flexloop/" target="_blank" rel="noopener noreferrer">
        <h1 class="wordmark">flex<span>loop</span></h1>
      </a>
      <button type="button" class="icon-btn" id="info-btn" data-act="info" aria-label="About this screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.6" r="0.75" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="icon-btn" id="theme-btn" data-act="theme" aria-label="Switch to light mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <button type="button" class="icon-btn" id="refresh-btn" data-act="refresh" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v6h-6"/></svg>
      </button>
    </div>
    <div id="topbar-action" class="topbar-action"></div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="rest" class="rest" hidden>
  <div class="rest-bar"><i id="rest-fill"></i></div>
  <div class="rest-row">
    <span class="rest-label">Rest</span>
    <span id="rest-clock" class="rest-clock">0:00</span>
    <button id="rest-add" class="rest-btn" type="button">+30s</button>
    <button id="rest-skip" class="rest-btn" type="button">Skip</button>
  </div>
</div>

<nav class="tabs" id="tabs">
  <a href="#/log"      data-tab="log"      class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"/></svg>
    <span>Log</span>
  </a>
  <a href="#/history"  data-tab="history"  class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>History</span>
  </a>
  <a href="#/progress" data-tab="progress" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-6 4 4 7-8"/></svg>
    <span>Progress</span>
  </a>
  <a href="#/settings" data-tab="settings" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4M4 19h16"/></svg>
    <span>Settings</span>
  </a>
</nav>

<!-- Full-screen sheet used for exercise picker, confirmations, editors. -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
